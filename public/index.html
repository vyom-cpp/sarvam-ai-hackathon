<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Saathi — Elder Companion AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div class="app"><aside><a class="brand" href="#"><span>✦</span> saathi</a><p class="tag">A gentler way to stay close.</p><nav><button class="nav active" data-view="overview">⌂ <span data-key="overview">Overview</span></button><button class="nav" data-view="companions">♡ <span data-key="seniors">Seniors</span></button><button class="nav" data-view="live">◉ <span data-key="companion">Live companion</span></button><button class="nav" data-view="timeline">◷ <span data-key="timeline">Care timeline</span></button><button class="nav" data-view="reminders">▣ <span data-key="reminders">Reminders</span></button><button class="nav" data-view="reports">▤ <span data-key="reports">Family reports</span></button><button class="nav" data-view="settings">⚙ <span data-key="settings">Settings</span></button></nav><div class="aside-bottom"><div class="privacy">⌁ Private by design<br><small>Only consented summaries are shared.</small></div><button id="reset" class="quiet">↻ Reset demo data</button></div></aside><main><header><div><p class="eyebrow" id="date"></p><h1>Good morning, Ananya.</h1></div><div class="header-tools"><span class="demo-pill" id="mode">● DEMO MODE</span><select id="ui-language" aria-label="Dashboard language"></select><button id="add-profile" class="button">+ Add senior</button></div></header><div id="notice" role="status" aria-live="polite"></div><section id="overview" class="view active"></section><section id="companions" class="view"></section><section id="live" class="view"></section><section id="timeline" class="view"></section><section id="reminders" class="view"></section><section id="reports" class="view"></section><section id="settings" class="view"></section></main></div>
<dialog id="profile-dialog"><form method="dialog"><button class="close">×</button><p class="eyebrow">NEW CARE CIRCLE</p><h2>Add a senior</h2><label>Preferred name<input id="new-name" required maxlength="80" placeholder="e.g. Leela Sharma"></label><label>Preferred language<select id="new-language"></select></label><label>Family contact<input id="new-family" maxlength="80" placeholder="e.g. Kavya Sharma"></label><button id="save-profile" class="button" value="default">Create profile</button></form></dialog>
<dialog id="reminder-dialog"><form method="dialog"><button class="close">×</button><p class="eyebrow">CARE RHYTHM</p><h2>Add a reminder</h2><label>For<select id="reminder-profile"></select></label><label>Type<select id="reminder-type"><option>Medication</option><option>Appointment</option></select></label><label>Title<input id="reminder-title" required maxlength="100" placeholder="e.g. Evening walk"></label><label>Time / date<input id="reminder-time" required maxlength="40" placeholder="e.g. 7:00 PM"></label><label>Care note (optional)<input id="reminder-note" maxlength="160" placeholder="No dosage instructions"></label><button id="save-reminder" class="button" value="default">Save reminder</button></form></dialog><script src="/app.js" defer></script></body></html>
